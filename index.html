<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordGrid Quest Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f9; margin: 0; padding: 24px; color: #1f2937; }
    .app { max-width: 780px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,0.08); }
    h1 { margin: 0 0 6px; font-size: 1.5rem; }
    .sub { color: #6b7280; margin-bottom: 18px; font-size: 0.95rem; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .score-box { background: #eef2ff; color: #3730a3; padding: 8px 14px; border-radius: 8px; font-weight: 700; }
    .board { display: grid; grid-template-columns: repeat(7, 56px); gap: 6px; justify-content: center; margin: 18px 0; }
    .cell {
      width: 56px; height: 56px; border: 2px dashed #cbd5e1; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.15rem;
      background: #f8fafc; cursor: pointer; user-select: none; position: relative;
    }
    .cell.start { background: #fef3c7; border-style: solid; border-color: #f59e0b; font-size: 0.72rem; }
    .cell.bonus-l { background: #e0f2fe; border-style: solid; border-color: #38bdf8; font-size: 0.75rem; }
    .cell.bonus-w { background: #fce7f3; border-style: solid; border-color: #f472b6; font-size: 0.75rem; }
    .cell.placed { background: #fff; border-style: solid; border-color: #2563eb; color: #111827; }
    .cell.locked { background: #dcfce7; border-style: solid; border-color: #16a34a; cursor: default; }
    .rack { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 14px 0; }
    .tile {
      width: 48px; height: 54px; background: #fffbeb; border: 2px solid #d97706; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 700; cursor: pointer; box-shadow: 0 2px 0 #d97706;
    }
    .tile.selected { transform: translateY(-4px); background: #fde68a; border-color: #b45309; }
    .tile span { font-size: 0.68rem; color: #92400e; }
    .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
    button {
      padding: 10px 16px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
      background: #2563eb; color: #fff;
    }
    button.secondary { background: #e5e7eb; color: #1f2937; }
    .status { text-align: center; margin-top: 12px; min-height: 24px; font-weight: 600; color: #0f766e; }
  </style>
</head>
<body>
  <div class="app">
    <h1>WordGrid Quest (Demo)</h1>
    <div class="sub">คลิกเลือกตัวอักษรจากถาด แล้วคลิกวางบนกระดานเพื่อสร้างคำศัพท์ภาษาอังกฤษ</div>
    <div class="topbar">
      <div class="score-box" id="scoreDisplay">คะแนนรวม: 0</div>
      <div class="score-box" id="turnDisplay">ตาที่: 1</div>
    </div>
    <div class="board" id="board"></div>
    <div class="rack" id="rack"></div>
    <div class="controls">
      <button id="submitBtn">ยืนยันคำศัพท์ (+คะแนน)</button>
      <button class="secondary" id="recallBtn">ดึงตัวอักษรกลับ</button>
      <button class="secondary" id="newRackBtn">สุ่มอักษรใหม่</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <script>
    const POINTS = { A:1,E:1,I:1,O:1,U:1,L:1,N:1,S:1,T:1,R:1, D:2,G:2, B:3,C:3,M:3,P:3, F:4,H:4,V:4,W:4,Y:4, K:5, J:8,X:8, Q:10,Z:10 };
    const LETTERS = "AAAAAAAAEEEEEEEEIIIIIIOOOOOUUUULLNNNNSSSSTTTTIRRRDDGGGBBCCMMPPFFHHVVWWYYKJXQZ".split("");
    const BONUS = {
      "3,3": "START",
      "1,1": "2L", "1,5": "2L", "5,1": "2L", "5,5": "2L",
      "0,3": "2W", "3,0": "2W", "3,6": "2W", "6,3": "2W"
    };

    let grid = Array.from({ length: 7 }, (_, r) =>
      Array.from({ length: 7 }, (_, c) => ({
        letter: null, locked: false, bonus: BONUS[`${r},${c}`] || null
      }))
    );
    let rack = [];
    let selectedRackIdx = null;
    let totalScore = 0;
    let turn = 1;

    function drawRack() {
      while (rack.length < 7) {
        const ch = LETTERS[Math.floor(Math.random() * LETTERS.length)];
        rack.push(ch);
      }
    }

    function renderBoard() {
      const boardEl = document.getElementById("board");
      boardEl.innerHTML = "";
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 7; c++) {
          const cell = grid[r][c];
          const div = document.createElement("div");
          div.className = "cell";
          if (cell.bonus === "START") div.classList.add("start");
          if (cell.bonus === "2L") div.classList.add("bonus-l");
          if (cell.bonus === "2W") div.classList.add("bonus-w");
          if (cell.locked) div.classList.add("locked");
          else if (cell.letter) div.classList.add("placed");

          div.textContent = cell.letter || cell.bonus || "";
          div.onclick = () => placeLetter(r, c);
          boardEl.appendChild(div);
        }
      }
    }

    function renderRack() {
      const rackEl = document.getElementById("rack");
      rackEl.innerHTML = "";
      rack.forEach((ch, idx) => {
        const div = document.createElement("div");
        div.className = "tile" + (selectedRackIdx === idx ? " selected" : "");
        div.innerHTML = `${ch}<span>${POINTS[ch]}</span>`;
        div.onclick = () => {
          selectedRackIdx = selectedRackIdx === idx ? null : idx;
          renderRack();
        };
        rackEl.appendChild(div);
      });
    }

    function placeLetter(r, c) {
      if (grid[r][c].locked) return;
      if (grid[r][c].letter) {
        rack.push(grid[r][c].letter);
        grid[r][c].letter = null;
        renderBoard();
        renderRack();
        return;
      }
      if (selectedRackIdx === null) return;
      grid[r][c].letter = rack[selectedRackIdx];
      rack.splice(selectedRackIdx, 1);
      selectedRackIdx = null;
      renderBoard();
      renderRack();
    }

    function recallLetters() {
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 7; c++) {
          if (!grid[r][c].locked && grid[r][c].letter) {
            rack.push(grid[r][c].letter);
            grid[r][c].letter = null;
          }
        }
      }
      selectedRackIdx = null;
      renderBoard();
      renderRack();
    }

    function submitWord() {
      const placed = [];
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 7; c++) {
          if (!grid[r][c].locked && grid[r][c].letter) placed.push({ r, c });
        }
      }
      if (placed.length < 2) {
        document.getElementById("status").textContent = "กรุณาวางตัวอักษรอย่างน้อย 2 ตัวเพื่อสร้างคำ";
        return;
      }
      let wordScore = 0;
      let wordMult = 1;
      for (const { r, c } of placed) {
        const ch = grid[r][c].letter;
        let pts = POINTS[ch] || 1;
        if (grid[r][c].bonus === "2L") pts *= 2;
        if (grid[r][c].bonus === "2W") wordMult *= 2;
        wordScore += pts;
        grid[r][c].locked = true;
      }
      const gained = wordScore * wordMult;
      totalScore += gained;
      turn += 1;
      drawRack();
      document.getElementById("scoreDisplay").textContent = `คะแนนรวม: ${totalScore}`;
      document.getElementById("turnDisplay").textContent = `ตาที่: ${turn}`;
      document.getElementById("status").textContent = `บันทึกคำสำเร็จ! ได้รับ +${gained} คะแนน (ตรวจสอบความถูกต้องของคำร่วมกันได้)`;
      renderBoard();
      renderRack();
    }

    document.getElementById("submitBtn").onclick = submitWord;
    document.getElementById("recallBtn").onclick = recallLetters;
    document.getElementById("newRackBtn").onclick = () => {
      recallLetters();
      rack = [];
      drawRack();
      renderRack();
    };

    drawRack();
    renderBoard();
    renderRack();
  </script>
</body>
</html>
